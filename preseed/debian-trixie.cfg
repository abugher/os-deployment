# https://wiki.debian.org/DebianInstaller/Preseed
# https://www.debian.org/releases/trixie/example-preseed.txt
# https://preseed.debian.net/debian-preseed/trixie/amd64-main-full.txt
# https://www.debian.org/releases/stable/amd64/apbs03.en.html

# Find options per package:
#       debconf-show <package>
# List all options for installer:
#       # package debconf-utils
#       debconf-get-selections --installer 
# List all options for current system:
#       debconf-get-selections


# Formatting:
#
# column 1              column 2                                        column 3
# <owner>               <question>                                      <type>  <value>
#
# There is no column 4.  Whitespace beyond one space between type and value
# will count as part of the value.
#
# To affect the installed system directly, specify owner as the name of the
# package containing the question.
#
# To affect the installer environment, specify owner as "d-i".  These lines may
# still indirectly affect the installed system.


# Configuration of installed system:

tasksel                 tasksel/first                                   multiselect standard, ssh-server
popularity-contest      popularity-contest/participate                  boolean false
openssh-server          openssh-server/password-authentication          boolean false
# Opposite day:  A value of "false" for openssh-server/permit-root-login yields
# a value of "yes" for PermitRootLogin in sshd_config.
openssh-server          openssh-server/permit-root-login                boolean false


# Configuration of installer environment:

d-i                     netcfg/get_hostname                             string unassigned-hostname
d-i                     netcfg/get_domain                               string unassigned-domain
d-i                     netcfg/choose_interface                         select ens3

d-i                     debian-installer/locale                         string en_US
d-i                     keyboard-configuration/xkb-keymap               select us

# These software selection options seem to have no effect on the installed system.
d-i                     apt-setup/main                                  boolean true
d-i                     apt-setup/non-free-firmware                     boolean true
d-i                     apt-setup/non-free                              boolean false
d-i                     apt-setup/contrib                               boolean false
apt-setup               apt-setup/contrib                               boolean false

d-i                     apt-setup/cdrom/set-first                       boolean false
d-i                     apt-setup/cdrom/set-next                        boolean false
# disable-cdrom-entries:  "false" means on the target system apt sources will
# be configured with a reference to the optical medium.  (This is an example of
# a setting for the installer indirectly affecting the installed system.)  The
# optical medium will still be used for installation.
#
# WARNING:  "false" will create a broken sources.list.  This is the first of
# two reasons mirror configuration is built into the late command string.
d-i                     apt-setup/disable-cdrom-entries                 boolean true

# use_mirror:  Decide whether to configure a mirror.
#
# WARNING:  Enabling a mirror with this and the following options will cause
# install to stop on "Bad archive mirror", despite all options encouraging
# install to continue with a broken mirror.  This is the second of two reasons
# mirror configuration is built into the late command string.
d-i                     apt-setup/use_mirror                            boolean false

# This line was hoped to configure a mirror for the installed system only, but
# still leads to install stopping on "Bad archive mirror".
#apt-setup               apt-setup/use_mirror                            boolean true

# no_mirror:  "true" means proceed even if a mirror was not configured.
d-i                     apt-setup/no_mirror                             boolean true
# error:  "Ignore" because the mirror is expected to be unavailable during installation.
d-i                     apt-setup/mirror/error                          select Ignore
# no-default:  "false" means to never go back and select a different mirror.
d-i                     mirror/no-default                               boolean false
# ... but install still stops on "Bad archive mirror".

# country:  "manual" means to skip trying to find and/or use a list of mirrors
# by country.
d-i                     mirror/country                                  string manual
# mirror/protocol:  
#
# "http" is default.  Packages are cryptographically signed and
# checked, so malicious interference by network providers should be impossible,
# even with a plain text protocol.
#
# "https" will obscure, to some degree, what information is being exchanged
# with the debian servers.  Volume and timing analysis are still possible, so
# the ISP may still find out whether the non-free-firmware tree is in use, for
# example.  If that risk is unacceptable, further obfuscation measures are
# necessary.  
d-i                     mirror/protocol                                 select https
# mirror/<protocol>/<thing>:  protocol must match "mirror/protocol" value.
# Default is "http".
#
# hostname, directory:  Specify a mirror not from a list.
d-i                     mirror/https/hostname                           string deb.debian.org
d-i                     mirror/https/directory                          string /debian
# proxy:  Leave empty for no proxy.
d-i                     mirror/https/proxy                              string

d-i                     passwd/make-user                                boolean false
d-i                     passwd/root-password                            password unspecified-password
d-i                     passwd/root-password-again                      password unspecified-password

d-i                     clock-setup/utc                                 boolean true
d-i                     time/zone                                       string US/Eastern
d-i                     clock-setup/ntp                                 boolean true

d-i                     partman-auto/disk                               string /dev/sda
d-i                     partman-auto/method                             string lvm
d-i                     partman-auto-lvm/guided_size                    string max
d-i                     partman-lvm/device_remove_lvm                   boolean true
d-i                     partman-md/device_remove_md                     boolean true
d-i                     partman-lvm/confirm                             boolean true
d-i                     partman-lvm/confirm_nooverwrite                 boolean true
d-i                     partman-auto/choose_recipe                      select atomic
d-i                     partman-partitioning/confirm_write_new_label    boolean true
d-i                     partman/choose_partition                        select finish
d-i                     partman/confirm                                 boolean true
d-i                     partman/confirm_nooverwrite                     boolean true
d-i                     partman-md/confirm                              boolean true
d-i                     partman-partitioning/confirm_write_new_label    boolean true
d-i                     partman/choose_partition                        select finish
d-i                     partman/confirm                                 boolean true
d-i                     partman/confirm_nooverwrite                     boolean true

d-i                     grub-installer/only_debian                      boolean true
d-i                     grub-installer/with_other_os                    boolean true
d-i                     grub-installer/bootdev                          string default

# Prevent prompt to reboot after install.
d-i                     finish-install/reboot_in_progress               note 
# Prevent prompt to eject/remove installation media.
d-i                     cdrom-detect/eject                              boolean false
# Poweroff instead of reboot.
d-i                     debian-installer/exit/poweroff                  boolean true


d-i                     preseed/late_command                            string \
  rm /target/etc/ssh/ssh_host_*_key*; \
  echo 'ssh_host_key_private_begin' > /target/etc/ssh/ssh_host_rsa_key; \
  echo 'ssh_host_key_private_body' >> /target/etc/ssh/ssh_host_rsa_key; \
  echo 'ssh_host_key_private_end' >> /target/etc/ssh/ssh_host_rsa_key; \
  chmod 0600 /target/etc/ssh/ssh_host_rsa_key; \
  echo 'ssh_host_key_public' > /target/etc/ssh/ssh_host_rsa_key.pub; \
  mkdir -p /target/root/.ssh; \
  echo 'ssh_authorized_key' >> /target/root/.ssh/authorized_keys; \
  rm /target/etc/apt/sources.list; \
  > /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Types: deb deb-src' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'URIs: https://deb.debian.org/debian' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Suites: trixie trixie-updates trixie-backports' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Components: main non-free-firmware' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo '' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Types: deb deb-src' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'URIs: https://security.debian.org/debian-security' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Suites: trixie-security' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Components: main non-free-firmware' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
  echo 'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' >> /target/etc/apt/sources.list.d/debian_trixie.sources; \
